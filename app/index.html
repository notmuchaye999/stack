<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Stack</title>
  <meta name="description" content="Stack every pay: bills, debts, savings and investing, with a rank that climbs as your net worth grows. Works offline; your data stays on your phone.">
  <meta name="theme-color" content="#F3EFE6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stack">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/ui/app.js"></script>
</head>
<body>
  <div class="test-bar" id="test-bar" hidden><span>Test mode · nothing saves</span><button class="link" type="button" data-act="test-end">End</button></div>
  <main class="scroll" id="scroll"><div class="app">
    <div class="lvl"><button class="lvl-in" id="lvl" type="button" data-act="pass" aria-label="Your rank"></button></div>

    <!-- HOME: how am I doing? -->
    <section class="tab cf home" id="tab-home">
      <div id="h-rank"></div>
      <div class="card" id="h-pay"></div>
      <div id="h-cf"></div>
    </section>

    <!-- SAVED: what have I put away? -->
    <section class="tab" id="tab-saved" hidden>
      <header class="tab-h"><h1 class="large">Accounts</h1></header>
      <div class="accts" id="sv-accts"></div>
    </section>

    <!-- STACK: this pay -->
    <section class="tab" id="tab-stack" hidden>
      <div class="tab" id="stk-list"></div>
      <div class="tab" id="stk-new">
        <header class="tab-h row-h"><div><h1 class="large">Stack your pay</h1></div><button class="link new-pay" type="button" data-act="stack-cancel" id="stk-cancel" hidden>Cancel</button></header>
        <div class="pv" id="pv-stack"></div>
      </div>
    </section>

    <!-- BILLS: what goes out? -->
    <section class="tab" id="tab-bills" hidden>
      <header class="tab-h"><h1 class="large">Bills</h1></header>
      <div class="card bills-hero" id="bd-sum"></div>
      <div id="bd-due"></div>
      <div class="grouped" id="bd-list"></div>
      <div id="bd-add"></div>
    </section>

    <!-- PLAN: how each pay splits, and where it gets you -->
    <section class="tab" id="tab-plan" hidden>
      <header class="tab-h row-h"><div><h1 class="large">Plan</h1></div><button class="gear" type="button" data-act="settings" aria-label="Settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
      <button class="pace nudge est-pill" type="button" data-n="est" id="p-est" hidden></button>
      <div class="sec-h"><h3>Your plan</h3><span id="p-cap"></span></div>
      <div class="pl-cards" id="p-cards"></div>
      <div class="sec-h"><h3>This pay</h3><span id="p-rem"></span></div>
      <div class="card">
        <div id="p-rc"></div>
        <div id="p-cs" hidden>
          <p class="p-crem" id="p-crem"></p>
          <div class="sp-bar" id="p-sbar" aria-hidden="true"></div>
          <div id="p-split"></div>
          <p class="pill" id="p-total" hidden></p>
          <div class="duo" id="p-btns" hidden></div>
        </div>
      </div>
      <div class="sec-h"><h3>Where it gets you</h3><span id="p-on"></span></div>
      <div class="pl-ms" id="p-ms"></div>
      <div class="sec-h"><h3>Path to FI</h3><span id="p-fi-note"></span></div>
      <div class="card">
        <p class="fi-what" id="p-fi-what"></p>
        <div class="fi-wrap" id="p-fi"></div>
        <div class="fi-x" id="p-fi-x"></div>
        <div class="legend" id="p-legend"></div>
      </div>
      <div class="sec-h"><h3>Assumptions</h3></div>
      <div class="grouped">
        <div class="frow"><span>Buffer</span><button class="nfield" type="button" data-n="em" id="n-em" aria-label="Buffer, months of bills and repayments"></button></div>
        <div class="frow"><span>Return after inflation</span><button class="nfield" type="button" data-n="ret" id="n-ret" aria-label="Return after inflation"></button></div>
        <div class="frow"><span id="wr-l">Withdrawal rate</span><div class="seg" role="group" aria-labelledby="wr-l"><button type="button" data-wr="4">4%</button><button type="button" data-wr="3.5">3.5%</button></div></div>
      </div>
    </section>
  </div></main>

  <nav class="tabbar" aria-label="Sections">
    <div class="tabbar-in">
      <button type="button" data-go="home" aria-current="page"><svg class="ti" viewBox="-10 -2 44 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button type="button" data-go="saved"><svg class="ti" viewBox="-10 -2 44 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 4l9 5.5M5 10v8M9.7 10v8M14.3 10v8M19 10v8M3 20h18"/></svg><span>Accounts</span></button>
      <button type="button" class="tb-mid" data-go="stack"><span class="ic"><svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="20" width="24" height="7" rx="1.5" fill="currentColor"/><rect x="6" y="11.5" width="18" height="7" rx="1.5" fill="currentColor"/><rect x="9" y="3" width="12" height="7" rx="1.5" fill="currentColor"/></svg></span><span>Stack</span></button>
      <button type="button" data-go="bills"><svg class="ti" viewBox="-10 -2 44 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.2" fill="currentColor"/><circle cx="4" cy="12" r="1.2" fill="currentColor"/><circle cx="4" cy="18" r="1.2" fill="currentColor"/></svg><span>Bills</span></button>
      <button type="button" data-go="plan"><svg class="ti" viewBox="-10 -2 44 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg><span>Plan</span></button>
    </div>
  </nav>
  <div class="qs" id="qs" role="dialog" aria-modal="true" aria-label="Build your stack" hidden></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
  <div class="scrim pad-scrim" id="pad-scrim" hidden></div>
  <div class="sheet pad" id="pad" role="dialog" aria-modal="true" aria-labelledby="pad-label" hidden>
    <div class="grab"></div>
    <div class="sheet-head"><h2 id="pad-label"></h2><button class="link" type="button" data-pad="clear">Clear</button></div>
    <p class="pad-val" id="pad-val" aria-live="polite"></p>
    <div class="keys" id="pad-keys"></div>
    <button class="btn primary big" type="button" data-pad="done" style="margin-top:12px">Done</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="bk-file" accept=".json,application/json,text/plain" hidden>
  <button class="toast update" id="update" type="button" hidden>Update ready · Tap to reload</button>
</body>
</html>
