/* Layout: phone-width app column, iOS-style grouped cards, 5-tab bar with a raised Stack button, bottom sheets for every form. */
:root{
  --sev1:#B8892F; --sev2:#C8642B; --sev3:#C8432B; --sev4:#8F2418;
  /* Ink on paper. Colour only means money: sand = bills, wisteria = savings for purchases, gold = spending, vermilion = debt (the one hot colour,
     also used for warnings), indigo = buffer, moss = investing. The Hubble deep field stays behind it all as the personal touch. */
  --bg:#F3EFE6; --surface:#FBF9F4; --sunk:#ECE7DC; --card:rgba(251,249,244,.95); --sky-o:.12; --sky-f:grayscale(1) invert(1) contrast(1.4); --sky-blend:multiply; --ink:#1A1816; --muted:#6F675D; --line:#DCD5C8; --knob:#FFFFFF;
  --bar:rgba(251,249,244,.92); --scrim:rgba(26,24,22,.35);
  --accent:#1A1816; --accent-ink:#F3EFE6;
  --c-pay:#1A1816; --c-buy:#7A68B0; --c-bills:#8A8073; --c-spend:#B8892F; --c-debt:#C8432B; --c-save:#3F6A9E; --c-invest:#5E8A45;
  --bad:#C8432B; --bad-bg:#F6E1DA; --warn:#C8432B; --warn-bg:#F6E1DA; --good:#4E7A38; --good-bg:#E3EBDA;
  --f-display:"Archivo","Arial Black",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}

  :root:not([data-theme="light"]){
    --bg:#121110; --sky:var(--sky-d); --surface:#1B1A18; --sunk:#252321; --card:rgba(27,26,24,.93); --sky-o:.55; --sky-f:none; --sky-blend:screen; --ink:#EDE8DF; --muted:#9A9186; --line:#2F2C29; --knob:#FFFFFF;
    --bar:rgba(27,26,24,.9); --scrim:rgba(0,0,0,.6);
    --accent:#EDE8DF; --accent-ink:#121110;
    --c-pay:#EDE8DF; --c-buy:#9384C4; --c-bills:#8C8478; --c-spend:#C9A04E; --c-debt:#E0543A; --c-save:#5A82B8; --c-invest:#7DAA5E;
    --bad:#EC6A50; --bad-bg:#3A1E18; --warn:#EC6A50; --warn-bg:#3A1E18; --good:#97BF78; --good-bg:#1F2A19;
    --sev1:#C9A04E; --sev2:#E07B3A; --sev3:#E0543A; --sev4:#C2301F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --sky:var(--sky-d); --surface:#1B1A18; --sunk:#252321; --card:rgba(27,26,24,.93); --sky-o:.55; --sky-f:none; --sky-blend:screen; --ink:#EDE8DF; --muted:#9A9186; --line:#2F2C29; --knob:#FFFFFF;
  --bar:rgba(27,26,24,.9); --scrim:rgba(0,0,0,.6);
  --accent:#EDE8DF; --accent-ink:#121110;
  --c-pay:#EDE8DF; --c-buy:#9384C4; --c-bills:#8C8478; --c-spend:#C9A04E; --c-debt:#E0543A; --c-save:#5A82B8; --c-invest:#7DAA5E;
  --bad:#EC6A50; --bad-bg:#3A1E18; --warn:#EC6A50; --warn-bg:#3A1E18; --good:#97BF78; --good-bg:#1F2A19;
  --sev1:#C9A04E; --sev2:#E07B3A; --sev3:#E0543A; --sev4:#C2301F;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* Deep field (NASA/ESA Hubble) behind everything: stars through the dark theme, faint paper flecks in the light one. */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--sky) center/cover no-repeat}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}
.tab{display:grid;gap:14px}
.large{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:28px;line-height:1.1;margin:6px 0 2px;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:13px;color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);;border-radius:10px;padding:16px;min-width:0}
.card-h{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:13px;color:var(--muted);margin:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.muted{color:var(--muted)}
.small{font-size:13px;margin:4px 0 0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.num small{color:var(--muted);font-size:11px}
.num.pos{color:var(--good)}
.neg{color:var(--bad)}
.chip{width:11px;height:11px;border-radius:3px;flex:none;display:inline-block}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;font-size:15px;font-weight:500;cursor:pointer}
.btn.wide{width:100%;margin-top:12px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.big{width:100%;min-height:52px;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger,.danger{color:var(--bad)}
.btn-row.danger{color:var(--bad)}
.badge.tag-urgent{background:var(--bad);color:#fff}
.badge.tag-focus{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tag-seg label{font-size:13px;padding:7px 4px}
.left-big{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:34px;line-height:1.05;margin:6px 0 0;font-variant-numeric:tabular-nums}
.left-big small{font-size:.42em;font-weight:800;color:var(--muted);margin-left:5px;letter-spacing:0}
.left-big.neg{color:var(--bad)}
.htodo{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;border:0;border-top:1px solid var(--line);background:none;padding:8px 0;text-align:left;cursor:pointer;color:var(--ink);font-weight:500}
.htodo .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htodo svg{flex:none;color:var(--muted)}
.sp-form #f-save{position:sticky;bottom:0;z-index:2;box-shadow:0 12px 0 var(--surface),0 -8px 0 var(--surface)}
input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:40px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.two>div{min-width:0}
.sp-form{gap:10px}
.sp-more{justify-self:center;color:var(--muted)}
.btn.danger-fill{background:var(--bad);color:var(--surface);border-color:transparent;font-weight:600}
.link{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;padding:4px}
.link.sm{font-size:13px;padding:0}
.link[data-armed]{color:var(--bad);font-weight:600}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* home */
.pace{margin:12px 0 0;padding:8px 10px;border-radius:8px;font-size:14px;font-weight:500;background:var(--sunk);color:var(--muted)}
.pace.good{background:none;padding:0;color:var(--ink)}
button.pace{display:block;width:100%;border:0;text-align:left;cursor:pointer;font:inherit;font-size:14px;font-weight:500;line-height:1.4}
.pace.warn{background:var(--warn-bg);color:var(--warn)}
.imp{font-family:var(--f-num);font-size:12px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.imp.later{background:var(--bad-bg);color:var(--bad)}
.imp.sooner{background:var(--good-bg);color:var(--good)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:14px}
.bar.thin{height:6px;margin-top:8px}
.bar span{display:block;height:100%;border-radius:99px}
/* grouped lists */
.grouped{background:var(--card);border:1px solid var(--line);;border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0;display:grid}
.row .grow b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row svg.chev{flex:none;color:var(--muted)}
.rcol{display:grid;justify-items:end;gap:3px;flex:none}
.btn-row{color:var(--ink);font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:1px;margin-left:2px}
.badge.ok{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.badge.od{background:var(--bad-bg);color:var(--bad)}
.empty{padding:16px 14px;margin:0;color:var(--muted)}
/* stack */
.pay-amt{display:flex;align-items:baseline;gap:4px;margin:6px 0 10px;font-family:var(--f-display);font-stretch:125%;line-height:1.05}
.pay-amt span{font-weight:800;font-size:30px;color:var(--muted)}
.pay-amt b{font-weight:900;font-size:clamp(40px,13vw,54px);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.date,select{font:inherit;font-size:16px;color:var(--ink);background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:7px 10px}
.paybar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:4px 0 6px;background:var(--sunk)}
.paybar span{display:block;height:100%}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--surface)}
/* plan vs actual */
.pva{display:grid;grid-template-columns:24px minmax(0,1fr) 66px 66px;gap:10px;align-items:center;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.pva.head{border-top:0;padding:4px 0;cursor:default;font:600 12px var(--f-body);color:var(--muted)}
.pva.head span:nth-child(n+3),.pva .num{text-align:right}
.pva.info{cursor:default}
.pva b{font-weight:500}
.pva .muted{display:block;font-size:12px}
.pva .num{font-size:14px}
.pva .act{font-weight:600}
.pva .tick{width:22px;height:22px}
.pva.done .tick{background:var(--ink);border-color:var(--ink)}
.pva.over .tick{background:var(--bad);border-color:var(--bad)}
.pva .tick.dot{border:0;background:none}
.pva .tick.dot i{width:11px;height:11px;border-radius:3px}
.pill{margin:12px 0 0;padding:9px 11px;border-radius:8px;font-size:14px;font-weight:500}
.pill.good{background:none;padding:0;color:var(--ink)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.key{height:54px;border:0;border-radius:8px;background:var(--sunk);font-family:var(--f-num);font-size:24px;font-weight:500;color:var(--ink);cursor:pointer;display:grid;place-items:center;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.key:active{background:var(--line);transform:scale(.97)}
.key:disabled{visibility:hidden}
/* spent & saved */
.sum-big{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:30px;margin:4px 0 0;line-height:1.1}
.sum-big small{font-size:14px;font-weight:800;color:var(--muted)}
.mv-imp{margin:0;font-size:14px;min-height:20px;color:var(--muted)}
.mv-imp.later{color:var(--bad)}
.mv-imp.sooner{color:var(--good)}
/* bills */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:8px;padding:3px;gap:3px}
.seg button,.seg label{border:0;background:none;border-radius:8px;padding:7px 8px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;text-align:center}
.seg button[aria-selected="true"],.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;background:var(--sunk);border-radius:8px;padding:10px 12px}
.switch-row > span{display:grid;font-weight:500}
.switch-row .muted{font-size:13px;font-weight:400}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--good)}
.switch:checked::after{transform:translateX(20px)}
/* plan */
.split{display:grid;gap:4px;margin-top:8px}
.srow{display:grid;gap:2px;padding-block:8px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.srow-h{display:flex;align-items:center;gap:8px}
.srow-h .sname{font-weight:500}
.srow-h .num{margin-left:auto;font-size:13px}
.srow-c{display:flex;align-items:center;gap:12px}
.srow-c input[type=range]{flex:1;min-width:0;height:28px;margin:0}
.nfield{display:flex;align-items:center;justify-content:flex-end;width:132px;min-height:40px;padding:8px 12px;border-radius:8px;border:1px solid transparent;background:var(--sunk);font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer;white-space:nowrap}
.nfield.left{justify-content:flex-start;width:100%}
.nfield.pct{width:78px;flex:none}
.field{display:flex;align-items:center;gap:2px;background:var(--sunk);border-radius:8px;padding-inline:10px;min-width:0;border:1px solid transparent}
.field:focus-within{border-color:var(--ink)}
.field input{border:0;background:transparent;outline:none;font-family:var(--f-body);font-size:16px;color:var(--ink);padding:8px 2px;width:100%;min-width:0}
.fi-wrap{position:relative;height:180px;margin-top:30px}
.fi-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fi-grid,.fi-label{position:absolute;left:0;transform:translateY(-115%);font-family:var(--f-num);font-size:11px;color:var(--muted)}
.fi-label{color:var(--ink);font-weight:600;font-size:12px}
.fi-dot{position:absolute;width:13px;height:13px;border-radius:50%;background:var(--c-invest);border:2px solid var(--surface);transform:translate(-50%,-50%)}
.fi-dl{position:absolute;transform:translate(-50%,calc(-100% - 10px));font-family:var(--f-num);font-size:12px;font-weight:600;white-space:nowrap}
.fi-dl.right{transform:translate(-100%,calc(-100% - 10px))}
.fi-x{position:relative;height:18px;margin-top:6px;font-family:var(--f-num);font-size:11px;color:var(--muted)}
.fi-x span{position:absolute;top:0;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:18px;height:0;border-top:2.5px solid var(--c-invest)}
.legend i.plan{border-top:2px dashed var(--muted)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:52px}
.frow:first-child{border-top:0}
.frow > span{font-weight:500}
.frow .seg{width:150px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:6px 0 0}
.pick{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 12px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:7px 0 8px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer}
.tabbar svg.ti{width:44px;height:28px;padding:3px 10px;border-radius:9px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] svg.ti{fill:currentColor;fill-opacity:.22}
.tb-mid .ic{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tb-mid .ic svg{width:22px;height:22px}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;margin-inline:auto;max-width:480px;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:14px 14px 0 0;padding:6px 16px calc(22px + env(safe-area-inset-bottom,0px));z-index:31;transform:translateY(100%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet.pad{z-index:51}
.scrim.pad-scrim{z-index:50}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sheet-head h2{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:20px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.form select{width:100%}
.err{margin:0;color:var(--bad);font-size:14px}
.pad-val{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:clamp(38px,12vw,48px);line-height:1.1;margin:2px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.pad-val small{font-size:.42em;font-weight:800;color:var(--muted);margin-left:6px}
.toast{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top,0px));transform:translate(-50%,-10px);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qs{position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.qs-in{max-width:480px;min-height:100%;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:14px}
.qs-top{display:flex;justify-content:space-between;align-items:center}
.qs-dots{display:flex;gap:6px}
.qs-dots span{width:22px;height:5px;border-radius:3px;background:var(--line)}
.qs-dots .done{background:var(--accent);opacity:.45}
.qs-dots .now{background:var(--accent)}
.qs-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto;position:sticky;bottom:0;padding:12px 0 calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg)}
body.qs-on{overflow:hidden}
.pv{display:grid;gap:14px}
.pv-amt{border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left;color:inherit;font:inherit;display:block;width:100%}
.pv-pad{display:grid;gap:10px}
.pv-pad[hidden]{display:none}
.pv-adjp{min-width:44px;text-align:right}
.bk-text{width:100%;font:12px/1.4 var(--f-code);background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.test-bar{position:fixed;top:0;left:0;right:0;z-index:24;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:14px}
.test-bar .link{color:var(--warn);font-weight:700}
body.test-on .app{padding-top:calc(54px + env(safe-area-inset-top,0px))}
.lvl{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:6px;width:calc(100% + 32px);margin:-14px -16px 2px;padding:6px 16px;border-bottom:1px solid var(--line);background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.lvl-in{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;text-align:left;padding:6px 0;min-height:44px}
body.test-on .lvl{top:calc(38px + env(safe-area-inset-top,0px))}
.lvl-n{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:15px;letter-spacing:.04em;white-space:nowrap}
.lvl-bar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:40px}
.lvl-bar span{display:block;height:100%;background:var(--accent);border-radius:3px}
.lvl-to{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.src-pick button{display:grid;gap:1px;text-align:left;border-radius:8px;padding:7px 11px}
.src-pick button small{font-size:11px;color:var(--muted);font-weight:500}
.src-pick button[aria-pressed="true"] small{color:inherit;opacity:.8}
.pv-carry{margin:-4px 0 6px;font-size:14px;color:var(--good)}
.pv-cover{margin:-4px 0 6px;font-size:14px;color:var(--bad)}

/* Every screen: a title that says what it's for, and enough to fit one phone screen. */
.tab-h{display:grid;gap:2px}
.tab-h .large{margin:4px 0 0}
.tab-h.row-h{grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:10px}
.gear{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:8px}
.new-pay{margin-top:8px;font-weight:600;color:var(--ink)}
.hint{margin:6px 0 0;color:var(--muted);font-size:14px}
.hint + .btn{margin-top:14px}
/* home */
.pace.nudge{background:var(--sunk);color:var(--ink)}
.htodo{min-height:42px;padding:6px 0}
/* saved */
.tile{display:grid;align-content:start;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.tile .card-h{display:flex;justify-content:space-between;align-items:center}
.tile .card-h svg{color:var(--muted)}
.tile .sum-big{font-size:clamp(20px,6.4vw,26px);font-variant-numeric:tabular-nums}
.flat{background:none;border:0;border-top:1px solid var(--line);border-radius:0;-webkit-backdrop-filter:none;backdrop-filter:none;margin-inline:-16px}
/* plan */
.sp-row{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:8px;align-items:center}
.sp-row:first-child{border-top:0}
.sp-row{min-height:40px;border-top:1px solid var(--line)}
.sp-n{display:grid;min-width:0}
.sp-n b{display:flex;align-items:center;gap:7px;font-weight:500;font-size:15px;white-space:nowrap}
.sp-n small{font-size:12px;color:var(--muted);padding-left:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-row input[type=range]{width:100%;min-width:0;height:28px;margin:0}
.sp-row .nfield{width:54px;min-height:34px;padding:4px 6px;justify-content:center;font-size:15px}
#p-btns{margin-top:8px}
#p-btns .btn{min-height:42px;padding-block:8px}
.fi-wrap{height:100px;margin-top:18px}
.fi-wrap.empty{height:auto;margin-top:8px}
.legend{margin-top:4px}
.fi-x{margin-top:4px}
.fi-dot.sm{width:10px;height:10px;border-width:1.5px}
/* stack: the pay screen */
.pv-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pv-top .pay-amt{margin:0;min-width:0}
.pv-top .date{flex:none}
.pv-top .pay-amt b{font-size:clamp(36px,11vw,48px)}
.pva{padding:8px 0}

.go-hint{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:15px}
/* the pay screen: plans as chips, then a receipt of where the pay goes */
.pv{gap:10px}
.pv-chips{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.pv-chip{display:grid;gap:1px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;text-align:left;cursor:pointer;}
.pv-chip b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-chip small{font-size:11px;line-height:1.3;color:var(--muted)}
.pv-chip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pv-chip.off{opacity:.55;cursor:default}
.pv-rc .paybar{margin:0 0 2px}
.rc-h{margin:10px 0 2px;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:12px;color:var(--muted)}
.rc-row{display:grid;grid-template-columns:11px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:25px;font-size:15px}
.rc-row span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-row .num{font-weight:600}
.rc-tot{margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-weight:600}

/* plans: chips wrap, a line on what the picked plan does, and the switch that keeps it */
.pv-chips{grid-auto-flow:row;grid-template-columns:1fr 1fr}
.pv-cap{margin:2px 2px -4px;font-size:12px;color:var(--muted)}
.pv-why{margin:-2px 2px 0;font-size:13px;color:var(--muted)}
.pv-mine{margin:0}
/* bills: tick each one off */
.brow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .row{border-top:0;padding-left:4px;flex:1;min-width:0}
.btick{flex:none;width:46px;border:0;background:none;display:grid;place-items:center;cursor:pointer;padding:0 0 0 12px;color:var(--surface)}
.btick i{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.btick.on i{background:var(--ink);border-color:var(--ink)}
.btick.late i{border-color:var(--bad)}
.btick.auto:not(.on) i{border-style:dashed}
.btick.none{cursor:default}
.btick.none i{visibility:hidden}
.pva.late b,.pva.late .muted{color:var(--bad)}
.pva.late .tick{border-color:var(--bad)}
.pva.auto .tick{border-style:dashed}
.htodo.s-late .grow{color:var(--bad)}
/* habits */
.streak{margin:8px 0 0;font-size:13px;font-weight:600;color:var(--good)}
.habit-l{margin:0;font-size:15px}
.habit-l b{font-weight:600}
.hbars{display:flex;gap:6px;height:30px;margin-top:10px}

/* ---------- feel ----------

.btn:active,.cf-add:active,.nfield:active,.pick button:active,.seg button:active,.pv-chip:active{transform:scale(.97);opacity:.82;transition-duration:0s}
button.pace:active{transform:scale(.98);transition-duration:0s}
.link:active{opacity:.45;transition-duration:0s}
.tabbar button:active{transform:scale(.9);transition-duration:0s}

.row,.htodo,.lvl-in{transition:background-color .25s,opacity .2s}

<div class="sheet pad" id="pad" role="dialog" aria-modal="true" aria-labelledby="pad-label" hidden>
  <div class="grab"></div>
  <div class="sheet-head"><h2 id="pad-label"></h2><button class="link" type="button" data-pad="clear">Clear</button></div>
  <p class="pad-val" id="pad-val" aria-live="polite"></p>
  <div class="keys" id="pad-keys"></div>
  <button class="btn primary big" type="button" data-pad="done" style="margin-top:12px">Done</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="bk-file" accept=".json,application/json,text/plain" hidden>
<script>
const KEY = 'stack-v4';
const BK = ['spend', 'pot', 'debt', 'save', 'invest'];
const BM = {
  spend:  { name: 'Spending', hint: 'Food, fuel and fun', color: 'var(--c-spend)' },
  pot:    { name: 'Savings', hint: 'For purchases. They unlock as it grows', color: 'var(--c-buy)' },
  debt:   { name: 'Debt', hint: 'On top of minimums, which come out first', color: 'var(--c-debt)' },
  save:   { name: 'Buffer', hint: 'Until your emergency fund is full', color: 'var(--c-save)' },
  invest: { name: 'Invest', hint: 'Plus anything left over', color: 'var(--c-invest)' },
};
const TY = {
  pay:      { name: 'Pay in', color: 'var(--c-pay)' },
  spend:    { name: 'Spent', color: 'var(--c-spend)' },
  debt:     { name: 'Debt', color: 'var(--c-debt)' },
  saved:    { name: 'Buffer', color: 'var(--c-save)' },
  invested: { name: 'Invested', color: 'var(--c-invest)' },
  pot:      { name: 'Savings', color: 'var(--c-buy)' },
  mkt:      { name: 'Market', color: 'var(--c-invest)' },
  xout:     { name: 'Moved out', color: 'var(--muted)' },
  topay:    { name: 'Into Pay', color: 'var(--c-pay)' },
  bill:     { name: 'Bill paid', color: 'var(--c-bills)' },
};
const IMPACT_TYPES = ['spend', 'saved', 'invested', 'debt'];
const FREQ = {
  week: { n: 52, label: 'Weekly', per: 'a week' }, fortnight: { n: 26, label: 'Fortnightly', per: 'a fortnight' },
  month: { n: 12, label: 'Monthly', per: 'a month' }, quarter: { n: 4, label: 'Quarterly', per: 'a quarter' },
  year: { n: 1, label: 'Yearly', per: 'a year' },
};
const DPM = 365.25 / 12;
const CHEV = '<svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m1.5 1.5 5 5-5 5"/></svg>';
const $ = s => document.querySelector(s);
const fmt = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', maximumFractionDigits: 0 });
const fmtC = new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
/* Exact to the cent when there are cents, whole dollars when there aren't. Balances and entries are always shown as entered. */
const money = v => { const c = Math.round((v || 0) * 100) / 100; return (c < 0 ? '−' : '') + (Math.abs(c - Math.round(c)) >= 0.005 ? fmtC : fmt).format(Math.abs(c)); };
/* Estimates (averages, targets, per-pay shares of a bill) stay in whole dollars. */
const money0 = v => money(Math.round(v || 0));
const kmoney = v => v >= 1e6 ? '$' + (v / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'm' : v >= 10000 ? '$' + Math.round(v / 1000) + 'k' : money(v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const clamp = v => Math.min(1, Math.max(0, v || 0));
const pad2 = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => iso(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const MNAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = s => { const d = parseISO(s); return `${d.getDate()} ${MNAMES[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
const monthYear = d => `${MNAMES[d.getMonth()]} ${d.getFullYear()}`;
const now = () => ({ date: today(), t: Date.now() });

let S;
let SNAP = null; // your data as it was when the open sheet first opened, for Undo

/* ---------- state ---------- */
function blank() {
  return { v: 4, pay: 0, freq: 'fortnight', pct: { spend: 0, pot: 0, debt: 0, save: 0, invest: 0 },
    bills: [], debts: [], buys: [], moves: [], stacks: [],
    startSaved: 0, startInvested: 0, savedAsOf: null, investedAsOf: null, startPool: 0, poolAsOf: null,
    emMonths: 3, ret: 6, wr: 4, sample: false };
}
function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) { const o = JSON.parse(r); if (o && o.v === 4) { o.buys = o.buys || []; return o; } }
  } catch (e) {}
  return blank();
}
let TEST = null; // your real data, kept aside while Test mode is on
/* Saving: this phone straight away, and your Claude account a moment later. The account copy is what another device
   (or this one after its storage gets cleared) loads from. Automatic saves (a pay re-stacking itself) stay on the phone. */
const CLOUD = { db: null, uid: null, ready: false, last: {}, busy: Promise.resolve(), timer: null, status: 'local' };
function save(auto) {
  REV++;
  if (TEST) return;
  if (!auto && CLOUD.ready) S.savedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (!auto) cloudSave();
}
const hasData = st => !!st && ((st.moves || []).length + (st.bills || []).length + (st.debts || []).length + (st.buys || []).length > 0);
const cref = k => CLOUD.db.doc(`data/users/${CLOUD.uid}/${k}`);
/* One main document, plus pays and entries by year (by month if a year gets big), so no document hits the size limit. */
function cloudParts(st) {
  const main = Object.assign({}, st); delete main.moves; delete main.stacks;
  const by = key => { const g = {}; (st.moves || []).forEach(m => (g[key(m.date)] = g[key(m.date)] || { moves: [], stacks: [] }).moves.push(m)); (st.stacks || []).forEach(x => (g[key(x.date)] = g[key(x.date)] || { moves: [], stacks: [] }).stacks.push(x)); return g; };
  const ys = by(d => 'y' + String(d || '0000').slice(0, 4)), out = {};
  Object.entries(ys).forEach(([k, v]) => {
    if (JSON.stringify(v).length < 200000) { out[k] = v; return; }
    Object.entries(by(d => 'm' + String(d || '0000-00').slice(0, 7))).forEach(([mk, mv]) => { if (mk.slice(1, 5) === k.slice(1)) out[mk] = mv; });
  });
  main.years = Object.keys(out).sort();
  return Object.assign(out, { main });
}
function setCloud(st) { CLOUD.status = st; const el = $('#cloud-st'); if (el) el.textContent = { ok: 'Your Claude account', local: 'This phone only', err: 'Not synced yet', full: 'Account storage full' }[st] || ''; }
function cloudSave() { if (!CLOUD.db || !CLOUD.ready || TEST) return; clearTimeout(CLOUD.timer); CLOUD.timer = setTimeout(cloudPush, 1200); }
function cloudPush() {
  CLOUD.busy = CLOUD.busy.then(async () => {
    if (!CLOUD.db || TEST) return;
    const parts = cloudParts(S), keys = Object.keys(parts).filter(k => k !== 'main').concat('main'); // years first, so main never lists a missing one
    for (const k of keys) {
      const j = JSON.stringify(parts[k]);
      if (CLOUD.last[k] === j) continue;
      try { await cref(k).set(JSON.parse(j)); CLOUD.last[k] = j; }
      catch (e) {
        const c = e && e.code;
        if (c === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); try { await cref(k).set(JSON.parse(j)); CLOUD.last[k] = j; continue; } catch (e2) {} }
        setCloud(c === 'quota_exceeded' ? 'full' : 'err');
        if (['invalid_argument', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed'].includes(c)) { CLOUD.db = null; setCloud('local'); }
        return;
      }
    }
    setCloud('ok');
  });
  return CLOUD.busy;
}
async function cloudPull(first) {
  if (!CLOUD.db || TEST) return;
  try {
    const m = await cref('main').get();
    if (!m.exists) { CLOUD.ready = true; if (hasData(S)) { S.savedAt = S.savedAt || Date.now(); cloudPush(); } else setCloud('ok'); return; }
    const main = JSON.parse(JSON.stringify(m.data())), cloudAt = main.savedAt || 0, localAt = S.savedAt || 0;
    // The account copy wins when it's newer, or when this phone has nothing in it.
    if ((cloudAt > localAt + 1 || (!hasData(S) && hasData(Object.assign({ moves: [1] }, main)))) && !TEST) {
      const st = Object.assign(main, { moves: [], stacks: [] });
      for (const k of main.years || []) { const d = await cref(k).get(); if (d.exists) { const v = d.data(); st.moves.push(...JSON.parse(JSON.stringify(v.moves || []))); st.stacks.push(...JSON.parse(JSON.stringify(v.stacks || []))); } }
      delete st.years;
      if (TEST) return;
      S = Object.assign(blank(), st); normalize();
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      CLOUD.last = {}; Object.entries(cloudParts(S)).forEach(([k, v]) => { CLOUD.last[k] = JSON.stringify(v); });
      CLOUD.ready = true; setCloud('ok');
      if (!$('#qs').hidden && hasData(S)) { $('#qs').hidden = true; document.body.classList.remove('qs-on'); }
      pvReset(); ui.stackNew = false; fillPlanInputs(); renderAll();
      if (!first) toast('Updated from your account');
      return;
    }
    CLOUD.ready = true;
    if (localAt > cloudAt + 1) cloudPush(); else setCloud('ok');
  } catch (e) { setCloud('err'); }
}
async function cloudInit() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    CLOUD.db = db; CLOUD.uid = id;
    await cloudPull(true);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') cloudPull(false); });
  } catch (e) {}
}

/* ---------- balances ---------- */
const ppy = () => FREQ[S.freq].n;
const monthly = (amt, every) => amt * FREQ[every].n / 12;
const sumPct = () => BK.reduce((s, k) => s + (S.pct[k] || 0), 0);
const billsMonthly = () => S.bills.reduce((s, b) => s + monthly(b.amount, b.every), 0);
const minsMonthly = () => S.debts.reduce((s, d) => s + (debtNow(d) > 0.005 ? d.min : 0), 0);
/* Buffer: months of bills plus debt repayments. A debt counts only up to what's left on it, so one that's nearly paid off
   doesn't inflate it. Spending isn't in it, so it doesn't jump around with what you spend. */
const bufferT = () => billsMonthly() * S.emMonths + S.debts.reduce((s, d) => { const o = debtNow(d); return o > 0.005 ? s + Math.min(d.min * S.emMonths, o) : s; }, 0);
/* Split used before you've set one: a little extra on debt if there is any, investing at least double the buffer. */
const fallbackPct = () => {
  const debt = S.debts.some(d => !d.set && debtPlan(d) > 0.005) ? 10 : 0, r = 70 - debt, save = savedNow() < bufferT() - 0.005 ? 5 * Math.floor(r / 15) : 0;
  return { spend: 30, pot: 0, debt, save, invest: r - save };
};
/* Custom: your split as you set it, or the starting one until you do. */
const customPct = () => sumPct() > 0 ? S.pct : fallbackPct();
const after = (asOf, m) => !asOf || m.date > asOf.date || (m.date === asOf.date && m.t > asOf.t);
const sumType = (type, ex, f) => S.moves.reduce((s, m) => m.type === type && m.id !== ex && (!f || f(m)) ? s + m.amount : s, 0);
const savedNow = ex => S.startSaved + sumType('saved', ex, m => after(S.savedAsOf, m)) - sumType('spend', ex, m => m.from === 'buffer' && after(S.savedAsOf, m)) - sumType('xout', ex, m => m.acct === 'buffer' && after(S.savedAsOf, m));
/* Investments: what you put in, plus what the market did (recorded when you update the balance). */
const investedNow = ex => S.startInvested + sumType('invested', ex, m => after(S.investedAsOf, m)) + sumType('mkt', ex, m => after(S.investedAsOf, m)) - sumType('xout', ex, m => m.acct === 'inv' && after(S.investedAsOf, m));
/* A credit can sit above its limit (in credit), so its raw balance can go below 0. The everyday card is where card money
   gets spent, so those spends land on it as well. */
const isWallet = d => !!(d && d.card && d.wallet);
const walletCard = () => S.debts.find(isWallet);
const rawOwed = (d, ex) => d.balance - sumType('debt', ex, m => m.ref === d.id && after(d.asOf, m)) + sumType('spend', ex, m => (m.credit === d.id || (isWallet(d) && isCard(m))) && after(d.asOf, m));
const debtNow = (d, ex) => Math.max(0, rawOwed(d, ex));
/* Spends on your card money: not from Savings, the buffer or credit. */
const isCard = m => m.type === 'spend' && !m.buy && !m.credit && m.from !== 'buffer' && m.from !== 'pool';
/* Money moved from Savings, the buffer or investments was already yours: it never counts as this pay's money. */
const OTHER = ['pool', 'buffer', 'inv'];
// From somewhere else (ext): new money, not this pay's, so it never counts as moved from the pay.
const ownMove = m => !OTHER.includes(m.from) && m.from !== 'ext';
/* The everyday card as the plan sees it. This pay's card money (and repayments paid from the card) counts as spent once it's
   loaded, so topping up and then spending it doesn't move the debt numbers: loading spending money isn't paying the debt
   off. Only what goes past the plan moves them. Spending and extra payments off the card share this pay's spending money
   (less anything moved past the plan straight from the pay, the way Home shows it). Planned payments off the card
   (Afterpay, say) were planned, so they don't count against it. */
function walletLoad(d, ex) {
  const stk = latestStack(); if (!stk) return { T: 0, B: 0, Sc: 0, cB: 0, X: 0, P: 0 };
  // Card money still on it from the last pay counts as already loaded.
  const I = stackItems(stk, ex), B = I.load;
  let T = I.carry, Sc = 0;
  S.moves.forEach(m => {
    if (!I.inP(m)) return;
    if (m.type === 'debt' && m.ref === d.id && ownMove(m)) T += m.amount;
    else if (isCard(m)) Sc += m.amount;
  });
  return { T, B, Sc, cB: cardBudget(stk) - I.overPay, X: I.over - I.overPay, P: I.cardPlan };
}
// Spending money that went somewhere else (moved off the pay) was never on the card, so it can't add to what the card owes.
const walletAdj = (d, ex) => { if (!isWallet(d)) return 0; const L = walletLoad(d, ex); return Math.min(L.T, L.B) - Math.min(L.Sc + L.X, Math.max(0, L.cB)) - L.P; };
/* What the card's own balance and the debt it counts as differ by: money on it for this pay, or spent before topping up. */
const holdTxt = d => { const h = isWallet(d) ? walletAdj(d) : 0; return h > 0.5 ? `${money(h)} of it is for this pay` : h < -0.5 ? `${money(-h)} spent before topping up` : ''; };
const debtPlan = (d, ex) => Math.max(0, rawOwed(d, ex) + walletAdj(d, ex));
/* Credit: anything with a limit (Card, Afterpay). Back to the limit is the goal; with Lock on, it's last-resort money after that. */
const credits = () => S.debts.filter(d => d.card);
const cardAvail = d => (d.limit || 0) - rawOwed(d);
const lockOn = d => !!d.card && d.lock !== false;
const cardLocked = d => lockOn(d) && rawOwed(d) <= 0.005;
function normalize() {
  S.buys = S.buys || []; delete S.payIn;
  S.moves.forEach(m => { if (m.note === 'From buffer') m.note = 'From Buffer'; });
  // Rows from the old bank import that were never money (ignored lines, bill lines) go.
  const oldBill = m => m.type === 'bill' && !m.ref;
  if (S.moves.some(m => m.type === 'skip' || oldBill(m))) S.moves = S.moves.filter(m => m.type !== 'skip' && !oldBill(m));
  // Once: the credit called Card is the everyday card, and Afterpay gets paid from it.
  if (!S.walletV) {
    const c = S.debts.find(d => d.card && /card/i.test(d.name));
    if (c && !S.debts.some(d => d.wallet)) { c.wallet = true; S.debts.forEach(d => { if (d !== c && /afterpay/i.test(d.name)) d.viaWallet = true; }); }
    S.walletV = 1;
  }
  // XP and the debt level are gone: rank replaced them.
  ['lvlV', 'lvlSeen', 'lvlBest', 'dlSeen', 'xpStart'].forEach(k => { delete S[k]; });
  // Once: a one-off amount due by a date (like a fine) becomes Urgent; then the card takes Focus if nothing else has it.
  if (!S.tagsV) {
    S.debts.forEach(d => { if (d.due && (d.minAmt || 0) >= d.balance - 0.5 && d.balance > 0) { d.urgent = true; d.focus = false; d.set = false; } });
    if (!S.debts.some(d => d.focus)) { const c = S.debts.find(d => d.card && !d.set && debtNow(d) > 0.005); if (c) c.focus = true; }
    S.tagsV = 1;
  }
  // Once: Savings becomes its own slice of the split. What went into Savings last pay comes off spending, so nothing jumps.
  if (S.pct.pot === undefined) {
    S.pct.pot = 0;
    const lt = latestStack(), rem = lt && lt.plan.rem, pt = lt ? potTotal(lt) : 0;
    if (rem > 0 && pt > 0.5 && sumPct() > 0) { const v = Math.min(S.pct.spend, r5(pt / rem * 100)); S.pct.pot = v; S.pct.spend -= v; }
  }
  // Once: plans. Your split becomes the Custom plan, so nothing changes until you pick another. A pay stacked on another
  // plan just for itself keeps the split it got.
  if (!S.planV) {
    if (!S.plan && sumPct() > 0) S.plan = 'custom';
    S.stacks.forEach(k => { if (k.pk && k.pk !== 'yours' && k.pct) k.one = true; else k.pk = 'custom'; });
    S.planV = 1;
  }
  // Once: a ticked "Move to Savings" becomes a real entry. It keeps the pay's time, so balances don't change.
  if (!S.potV) {
    S.stacks.forEach(k => { if (k.potsDone) { const v = Math.round(potTotal(k) * 100) / 100; if (v > 0.5) S.moves.push({ id: uid(), t: k.t, date: k.date, amount: v, type: 'pot', note: 'Savings', src: 'manual' }); } delete k.potsDone; });
    S.potV = 1;
  }
  // Once: bill ticks start today. Due dates before today count as paid; this pay's every-pay bills too if it landed before today.
  if (!S.billV) {
    const lt = latestStack(), t = today();
    S.bills.forEach(b => {
      if (everyPay(b.every)) { if (lt && lt.date < t) b.paidTo = lt.date; }
      else if (b.due && needsDate(b.every)) { const l = lastOn(b.due, b.every, addDays(t, -1)); if (l) b.paidTo = l; }
    });
    S.billV = 1;
  }
  // Once: Afterpay is pay in 4.
  if (!S.in4V) { S.debts.forEach(d => { if (d.card && !d.wallet && /afterpay/i.test(d.name)) d.in4 = true; }); S.in4V = 1; }
  // Pay-in-4 schedules that have finished drop off.
  S.debts.forEach(d => { if (d.inst) d.inst = d.inst.filter(x => instDates(x).at(-1) >= addDays(today(), -14)); });
}
/* One keyword per debt. Urgent: a hard deadline, paid in full by its date and first in line. Focus: gets the extra.
   Fixed: scheduled payments only, never extra. Steady: minimums until it's next in line. */
const TAGS = ['urgent', 'focus', 'fixed', 'steady'];
const TAGN = { urgent: 'Urgent', focus: 'Focus', fixed: 'Fixed', steady: 'Steady' };
const tagOf = d => d.urgent ? 'urgent' : d.focus ? 'focus' : d.set ? 'fixed' : 'steady';
function setTag(d, t) { if (t === 'focus') S.debts.forEach(x => { if (x !== d) x.focus = false; }); Object.assign(d, { urgent: t === 'urgent', focus: t === 'focus', set: t === 'fixed' }); }
const tagPick = (cur) => `<div><p class="lbl">Priority</p><div class="seg tag-seg" role="radiogroup" aria-label="Priority">${TAGS.map(t => `<label><input type="radio" name="f-tag" value="${t}"${t === cur ? ' checked' : ''}>${TAGN[t]}</label>`).join('')}</div><p class="muted small">Urgent: paid first, before your split. Focus: gets your debt money first. Fixed: repayments only. Steady: waits its turn.</p></div>`;
const pickedTag = () => { const r = document.querySelector('input[name="f-tag"]:checked'); return r ? r.value : 'steady'; };
const debtTotal = ex => S.debts.reduce((s, d) => s + debtPlan(d, ex), 0);
// What your bank says you owe, all together.
const bankOwed = () => S.debts.reduce((s, d) => s + debtNow(d), 0);
// Net worth: every account, Pay included, less what your bank says you owe. A card in credit is money you hold.
const owedNW = () => S.debts.reduce((a, d) => a + (d.card ? rawOwed(d) : debtNow(d)), 0);
const netWorth = () => payAcctBal() + savedNow() + poolBal() + investedNow() - owedNW();
/* Who gets extra money first: the debt you chose to focus on, then overdrawn accounts, then whatever's charging the most interest,
   then interest-free debts whose free period ends soonest. */
const untilKey = d => d.free && d.until ? parseISO(d.until).getTime() : Infinity;
const order = ds => [...ds].sort((a, b) => (b.urgent ? 1 : 0) - (a.urgent ? 1 : 0) || (b.focus ? 1 : 0) - (a.focus ? 1 : 0) || ((b.od || b.card) ? 1 : 0) - ((a.od || a.card) ? 1 : 0) || effRate(b) - effRate(a) || untilKey(a) - untilKey(b));
const debtName = id => { const d = S.debts.find(x => x.id === id); return d ? d.name : 'Debt'; };

/* Monthly money, and your plan's phases on your average pay. pct is the last phase: the one you're on at FI. */
function levels() {
  const C0 = cycles(), incM = C0 ? C0.incM : 0;
  const billsM = billsMonthly(), minsM = minsMonthly(), remM = incM - billsM - minsM;
  const ph = effSpec().phases(perPay(Math.max(0, remM))), pct = ph[ph.length - 1].pct;
  const sc = Math.max(100, BK.reduce((s, k) => s + (pct[k] || 0), 0));
  return { pct, ph, incM, billsM, minsM, remM, sh: k => Math.max(0, remM) * (pct[k] || 0) / sc };
}

/* Pay cycles: each pay you enter, up to the next one. The countdown works from these: one pay, then the average of two, three and so on. */
const periodDays = () => S.freq === 'week' ? 7 : S.freq === 'fortnight' ? 14 : Math.round(DPM);

    <p class="muted small">${sh ? `${pay} can't cover what's still due` : 'after what\'s still due'} · ${pay} ${money(N.cash)}${N.spent > 0.005 ? ` · ${money(N.spent)} spent` : ''}</p>
    <div class="duo h-acts"><button class="btn primary" type="button" data-act="spent">${SPENT_IC}Spent</button><button class="btn" type="button" data-act="moved">${MOVED_IC}Moved</button></div>${todo}`;
}

/* The next payment on a debt, in words: "By 31 Oct", "$150 every pay", "$175 · 31 Oct", "Overdue · 31 Oct". */
function nextPay(d) {
  const owed = debtNow(d), amt = Math.min(owed, d.minAmt ?? d.min ?? 0), ev = d.minEvery || 'month';
  if (overdue(d)) return `<span class="neg">Overdue · ${fmtDate(d.due)}</span>`;
  if (!(amt > 0.5)) return '';
  if (everyPay(ev)) return `${money0(perPay(monthly(amt, ev)))} every pay`;
  if (!d.due) return `${money(amt)} ${FREQ[ev].per}`;
  const dt = nextOn(d.due, ev, today());
  return amt >= owed - 0.5 ? `By ${fmtDate(dt)}` : `${money(amt)} · ${fmtDate(dt)}`;
}
const tagBadge = d => `<span class="badge tag-${tagOf(d)}">${TAGN[tagOf(d)]}</span>`;

/* ---------- entries: each one lives with what it belongs to ---------- */
function moveRow(m) {
  const b = m.buy && (S.buys || []).find(x => x.id === m.buy);
  const ref = (m.type === 'debt' && m.ref ? ' · ' + esc(debtName(m.ref)) : '') + (b ? ' · for ' + esc(b.name) : '') + (m.type === 'spend' && m.credit ? ' · on ' + esc(debtName(m.credit)) : '') + (m.type === 'spend' && m.from === 'buffer' ? ' · from ' + esc(nameOf('buffer')) : '') + (m.type === 'spend' && m.from === 'pool' ? ' · from ' + esc(nameOf('pool')) : '') + (m.type === 'topay' && m.from ? ' · from ' + esc(acctName(m.from)) : '');
  return `<button class="row" type="button" data-act="move" data-id="${m.id}"><i class="chip" style="background:${TY[m.type].color}"></i>
    <span class="grow"><b>${esc(m.note || TY[m.type].name)}</b><span class="muted small" style="margin:0">${fmtDate(m.date)}${ref}</span></span>
    <span class="rcol"><span class="num">${money(m.amount)}</span>${impHTML(impactOf(m))}</span></button>`;
}
const rowsOf = (ms, empty, n = 50) => ms.length ? ms.slice(0, n).map(moveRow).join('') + (ms.length > n ? `<p class="empty">Latest ${n} of ${ms.length}.</p>` : '') : `<p class="empty">${empty}</p>`;

/* ---------- the pay account ----------
   What's in it: pays once they're in, less what's moved out of them, bills paid from it and spending straight from it
   (when there's no card), on top of the balance you last set. A pay is in it as soon as it's stacked. */
const outOfPay = m => (m.type === 'debt' || m.type === 'saved' || m.type === 'pot' || m.type === 'invested') && !m.from;
const payAnchor = () => { if (S.payAcct) return S.payAcct; const f = sortMoves(S.moves.filter(m => m.type === 'pay')).pop(); return f ? { start: 0, asOf: { date: f.date, t: f.t - 1 } } : {}; };
function payAcctBal() {
  const a = payAnchor(), aft = m => after(a.asOf, m), wc = walletCard();
  let v = a.start || 0;
  S.moves.forEach(m => { if ((m.type === 'pay' || m.type === 'topay') && aft(m)) v += m.amount; });
  S.moves.forEach(m => { if (aft(m) && (outOfPay(m) || m.type === 'bill' || (!wc && isCard(m)))) v -= m.amount; });
  return Math.round(v * 100) / 100;
}
function payAcctSheet() {
  const v = payAcctBal(), lt = latestStack(), a = payAnchor();
  const ms = sortMoves(S.moves.filter(m => after(a.asOf, m) && (m.type === 'pay' || m.type === 'topay' || m.type === 'bill' || outOfPay(m))));
  openSheet(esc(nameOf('pay')), `<div class="form"><div><p class="sum-big" style="margin:0">${money(v)}</p><p class="muted small">Your pay lands here and goes out from here.</p></div>
    <button class="btn wide" type="button" id="pa-upd" style="margin-top:0">Update</button>
    ${nameRow('pay')}
    <div><p class="lbl">Entries</p><div class="grouped">${rowsOf(ms, 'Nothing yet.')}</div></div></div>`);
  $('#pa-upd').onclick = () => numpad({ label: `${nameOf('pay')} balance now`, prefix: '$', dec: 2, max: 1e9, value: v, onDone: x => { S.payAcct = { start: x, asOf: now() }; save(); renderAll(); payAcctSheet(); toast(`${nameOf('pay')} ${money(x)}`); } });
  nameField('pay');
}

/* ---------- render: accounts ----------
   Laid out like your bank: each account with Available and Balance, in the same order. Under it, what Stack adds. */
const money2 = v => { const c = Math.round((v || 0) * 100) / 100; return (c < 0 ? '−' : '') + fmtC.format(Math.abs(c)); };
// Credit shows what's available and what's owed, like the bank. Everything else is just its balance: Stack can't see
// pending payments, so it doesn't pretend to know what's available.
function acctCard(c, act, id, name, role, avail, bal, extra) {
  const v = avail === null ? `<span>Balance</span><b class="num">${money2(bal)}</b>` : `<span>Available</span><b class="num">${money2(avail)}</b><span>Balance</span><span class="num">${money2(bal)}</span>`;
  return `<div class="acct-c" style="--c:${c}"><button class="acct-h" type="button" data-act="${act}"${id ? ` data-id="${id}"` : ''}><span class="acct-n"><b>${esc(name)}</b>${role ? `<small>${role}</small>` : ''}</span>${CHEV}</button>
    <div class="acct-v">${v}</div>${extra ? `<div class="acct-x">${extra}</div>` : ''}</div>`;
}
/* ---------- render: saved ---------- */
function renderSaved(D) {
  const { P } = D, sv = savedNow(), inv = investedNow(), emT = bufferT(), fiT = P.none ? 0 : P.fiT, pool = poolBal(), lt = latestStack(), I = lt && stackItems(lt);
  const per = emT > 0 ? emT / S.emMonths : 0, full = emT > 0 && sv >= emT - 0.5, out = [];
  // Pay account: whether this pay is in yet, and what of it is still to move.

    N ? `<button class="link sm acct-go" type="button" data-go="stack">${N.short > 0.005 ? `${money(N.short)} short` : `${money(N.free)} free`}${jobs ? ` · ${jobs} still due` : ''} ›</button>` : ''));
  // Buffer: one cell per month it covers.
  const cells = Array.from({ length: Math.max(1, S.emMonths) }, (_, i) => `<i style="--f:${per > 0 ? (clamp(sv / per - i) * 100).toFixed(1) : 0}%"></i>`).join('');
  out.push(acctCard('var(--c-save)', 'buffer', '', nameOf('buffer'), roleOf('buffer'), null, sv,
    `<span class="shield${full ? ' full' : ''}">${cells}</span><span>${emT > 0 ? (full ? `Full · ${S.emMonths} months of bills and repayments` : `${(sv / per).toFixed(1)} of ${S.emMonths} months · ${money0(emT - sv)} to full`) : 'Add bills to set it'}</span>`));
  // Savings: what it's for, each purchase with its bar.
  const U = unlocks(), pin = N && N.done.find(o => o.k === 'pool'), psug = N && N.sugs.find(o => o.to === 'pool');
  const rows = U.items.map(x => `<button class="row" type="button" data-act="buy" data-id="${x.b.id}"><span class="grow"><b>${esc(x.b.name)}</b><span class="muted small" style="margin:0">${x.open ? '<span class="badge ok">Unlocked</span>' : etaTxt(x)}</span><span class="ubar1"><i style="width:${(clamp(U.pool / x.b.cost) * 100).toFixed(1)}%"></i></span></span><span class="num">${money(x.b.cost)}</span>${CHEV}</button>`).join('');
  const pp = lt ? potTotal(lt) : 0;
  out.push(acctCard('var(--c-buy)', 'pool-hist', '', nameOf('pool'), roleOf('pool'), null, pool,
    `<span>${!lt ? 'For purchases' : pin ? `${money(pin.amt)} in this pay${pin.sub ? ' · ' + pin.sub : ''}` : psug ? `${money(psug.amt)} suggested this pay` : 'Nothing in this pay'}</span>${rows ? `<div class="grouped flat">${rows}</div>` : ''}<button class="link sm acct-go" type="button" data-act="add-buy">Add a purchase ›</button>`));
  // Credit: the card you spend on first, with this pay's spending money; then the rest.
  [...credits()].sort((a, b) => (b.wallet ? 1 : 0) - (a.wallet ? 1 : 0)).forEach(d => {
    const tu = d.wallet && N ? N.sugs.find(x => x.to === 'card') : null, ex = d.wallet && N ? `<span>${money(N.spent)} spent this pay${tu ? ` · top up ${money(tu.amt)} suggested` : ''}</span>` : '';
    out.push(acctCard('var(--c-debt)', 'credit', d.id, d.name, d.wallet ? 'Credit card' : 'Credit', cardAvail(d), -rawOwed(d), ex));
  });
  out.push(acctCard('var(--c-invest)', 'invested', '', nameOf('inv'), roleOf('inv'), null, inv,
    `<span class="climb"><i style="width:${(fiT > 0 ? clamp(inv / fiT) * 100 : 0).toFixed(2)}%"></i></span><span>${fiT > 0 ? `${(inv / fiT * 100).toFixed(1)}% of your FI number, ${kmoney(fiT)}` : 'FI after your first pay'}</span>`));

}
/* Buffer, Savings or investments: the balance, Update, and every entry. */
function entriesSheet(k) {
  const buf = k === 'buffer', pool = k === 'pool', P = BASE_P, U = pool ? unlocks() : null;
  const v = buf ? savedNow() : pool ? poolBal() : investedNow(), target = buf ? bufferT() : pool ? U.total : P && !P.none ? P.fiT : 0;
  const xo = a => m => m.type === 'xout' && m.acct === a;
  const ms = sortMoves(S.moves.filter(m => buf ? m.type === 'saved' || (m.type === 'spend' && m.from === 'buffer') || xo('buffer')(m) : pool ? m.type === 'pot' || poolOut(m) || xo('pool')(m) : m.type === 'invested' || m.type === 'mkt' || xo('inv')(m)));
  const sub = buf ? `Emergency money. ${S.emMonths} months of bills and repayments.` : pool ? (target > 0 ? 'For purchases. The target covers your whole list.' : 'For purchases. They unlock as it grows.')
    : target > 0 ? `FI number ${kmoney(target)}. At ${S.wr}% a year it covers your bills and spending.` : 'Your FI number shows after your first pay.';
  const how = buf || pool ? 'Type what your bank shows. The change is recorded: money in raises your rank, money out lowers it.' : 'Type what it\'s worth. What you put in and what the market does both move your rank.';
  openSheet(esc(nameOf(buf ? 'buffer' : pool ? 'pool' : 'inv')), `<div class="form"><div><p class="sum-big" style="margin:0">${money(v)}${target > 0 ? `<small> of ${buf ? money0(target) : pool ? money(target) : kmoney(target)}</small>` : ''}</p>
      <div class="bar thin"><span style="width:${(target > 0 ? clamp(v / target) : 0) * 100}%;background:var(${buf ? '--c-save' : pool ? '--c-buy' : '--c-invest'})"></span></div>
      <p class="muted small">${sub}</p></div>
    <button class="btn primary big" type="button" id="en-upd">Update</button>
    <p class="muted small" style="margin:-4px 0 0">${how}</p>
    ${nameRow(buf ? 'buffer' : pool ? 'pool' : 'inv')}
    <div><p class="lbl">Entries</p><div class="grouped">${rowsOf(ms, 'Nothing recorded yet.')}</div></div></div>`);
  $('#en-upd').onclick = () => updateBal(k, () => entriesSheet(k));
  nameField(buf ? 'buffer' : pool ? 'pool' : 'inv');
}
/* Update: type what your bank says. The first one is where you start. After that the difference is recorded as money
   that moved: in raises your rank and ticks off this pay's transfer, out lowers it. Investments split it into what you put in
   and what the market did. */
const BAL = {
  buffer:   { label: 'Buffer in your bank now', get: () => savedNow(), any: m => m.type === 'saved' || (m.type === 'spend' && m.from === 'buffer') || (m.type === 'xout' && m.acct === 'buffer'), asOf: () => S.savedAsOf, start: v => { S.startSaved = v; S.savedAsOf = now(); } },
  pool:     { label: 'Savings in your bank now', get: () => poolBal(), any: m => m.type === 'pot' || poolOut(m) || (m.type === 'xout' && m.acct === 'pool'), asOf: () => S.poolAsOf, start: v => { S.startPool = v; S.poolAsOf = now(); } },
  invested: { label: 'Investments worth now', get: () => investedNow(), any: m => m.type === 'invested' || m.type === 'mkt' || (m.type === 'xout' && m.acct === 'inv'), asOf: () => S.investedAsOf, start: v => { S.startInvested = v; S.investedAsOf = now(); } },
};
/* With your pay going into the Buffer account, what of this pay is still sitting in it: jobs not done (a payment made
   from the card is already in the card's top-up), bills not paid, and spending money if there's no card it goes onto. */
function payStillIn() {
  const lt = latestStack(); if (!lt || S.payIn !== 'buffer') return 0;
  const I = stackItems(lt);
  return Math.round((I.todos.reduce((a, i) => a + (i.via ? 0 : Math.max(0, i.plan - i.done)), 0) + billsDueNow().reduce((a, x) => a + (x.paid ? 0 : x.amount), 0) + (walletCard() ? 0 : Math.max(0, I.left))) * 100) / 100;
}
/* Money that showed up in Buffer or Savings while a pay is running: from this pay, or from somewhere else. */
function fromSheet(k, amt, done) {
  const name = k === 'buffer' ? 'Buffer' : 'Savings';
  openSheet(`${name} +${money(amt)}`, `<div class="form"><p class="muted" style="margin:0">Where did it come from?</p><div class="grouped">
    <button class="row" type="button" data-from="pay"><span class="grow"><b>This pay</b><span class="muted small" style="margin:0">Counts as moved from this pay</span></span></button>
    <button class="row" type="button" data-from="ext"><span class="grow"><b>Somewhere else</b><span class="muted small" style="margin:0">Interest, a refund, money sent to you. Your pay isn't touched</span></span></button></div></div>`);
  $('#sheet').querySelectorAll('[data-from]').forEach(el => { el.onclick = () => {
    S.moves.push(Object.assign({ id: uid(), t: Date.now(), date: today(), src: 'manual', amount: amt, note: name, type: k === 'buffer' ? 'saved' : 'pot' }, el.dataset.from === 'ext' ? { from: 'ext' } : {}));
    closeSheet(); done(`${name} +${money(amt)}${el.dataset.from === 'ext' ? ' from somewhere else' : ''}`);
  }; });
}
function updateBal(k, back) {
  const c = BAL[k], cur = Math.round(c.get() * 100) / 100, first = !c.asOf() && !S.moves.some(c.any);
  const still = k === 'buffer' ? payStillIn() : 0, lt = latestStack(), running = !!lt && lt.date <= today();
  numpad({ label: still > 0.5 ? 'Buffer account balance now' : c.label, prefix: '$', dec: 2, max: 1e9, value: cur + still, onDone: typed => {
    // Pay goes into the Buffer account: ask whether it's in yet, then take off what of it is still there.
    if (still > 0.5 && !first) {
      openSheet(`Buffer account ${money(typed)}`, `<div class="form"><p class="muted" style="margin:0">This pay still has ${money(still)} in that account to move. Is it paid in yet?</p><div class="grouped">
        <button class="row" type="button" data-in="1"><span class="grow"><b>Yes</b><span class="muted small" style="margin:0">Buffer is ${money(typed - still)}</span></span></button>
        <button class="row" type="button" data-in="0"><span class="grow"><b>Not yet</b><span class="muted small" style="margin:0">Buffer is ${money(typed)}</span></span></button></div></div>`);
      $('#sheet').querySelectorAll('[data-in]').forEach(el => { el.onclick = () => { closeSheet(); apply(el.dataset.in === '1' ? Math.max(0, typed - still) : typed); }; });
      return;
    }
    apply(typed);
  } });
  function apply(v) {
    const diff = Math.round((v - cur) * 100) / 100, done = msg => { save(); renderAll(); if (back) back(); toast(msg); };
    const mv = o => S.moves.push(Object.assign({ id: uid(), t: Date.now(), date: today(), src: 'manual' }, o));
    if (first) { c.start(v); return done(`Starting at ${money(v)}`); }
    if (Math.abs(diff) < 0.005) return toast('No change');
    if (k === 'invested') return investSheet(cur, v, back);
    const name = k === 'buffer' ? 'Buffer' : 'Savings';
    if (diff > 0) { if (running) return fromSheet(k, diff, done); mv(k === 'buffer' ? { type: 'saved', amount: diff, note: 'Buffer' } : { type: 'pot', amount: diff, note: 'Savings' }); return done(`${name} +${money(diff)}`); }
    if (k === 'buffer') { mv({ type: 'spend', from: 'buffer', amount: -diff, note: 'From Buffer' }); return done(`Buffer −${money(-diff)}`); }
    poolOutSheet(-diff, back);
  }
}
/* Savings went down: what was it for? A purchase gets marked bought. */
function poolOutSheet(x, back) {
  const bs = openBuys();
  openSheet(`Savings −${money(x)}`, `<div class="form"><p class="muted" style="margin:0">What was it for?</p>
    <div class="grouped">${bs.map(b => `<button class="row" type="button" data-pout="${b.id}"><span class="grow"><b>${esc(b.name)}</b><span class="muted small" style="margin:0">Marks it bought</span></span><span class="num">${money(b.cost)}</span></button>`).join('')}<button class="row" type="button" data-pmove><span class="grow"><b>Moved to another account</b></span></button><button class="row" type="button" data-pout=""><span class="grow"><b>Something else</b></span></button></div></div>`);
  $('#sheet').querySelector('[data-pmove]').onclick = () => movedSheet({ from: 'pool', amount: x, after: back });
  $('#sheet').querySelectorAll('[data-pout]').forEach(el => { el.onclick = () => {
    const b = el.dataset.pout ? S.buys.find(y => y.id === el.dataset.pout) : null;
    S.moves.push(Object.assign({ id: uid(), t: Date.now(), date: today(), amount: x, type: 'spend', src: 'manual' }, b ? { buy: b.id, grp: uid(), note: b.name } : { from: 'pool', note: 'From Savings' }));
    if (b) b.bought = true;
    save(); closeSheet(); renderAll(); if (back) back(); toast(b ? `${b.name} bought` : `Savings −${money(x)}`);
  }; });
}
/* Investments changed: what you put in (this pay's investing to start with) and what the market did. */
function investSheet(cur, v, back) {
  const lt = latestStack(), it = lt && stackItems(lt).todos.find(i => i.type === 'invested'), diff = Math.round((v - cur) * 100) / 100;
  const f = { put: it ? Math.max(0, Math.round((it.plan - it.done) * 100) / 100) : 0 };
  openSheet('Investments', `<div class="form"><p class="sum-big" style="margin:0">${money(cur)}<small> → </small>${money(v)}</p>
    <div class="two"><div><span class="lbl">You put in</span><button class="nfield left" type="button" id="iv-put" aria-label="You put in"></button></div>
      <div><span class="lbl">Market</span><div class="nfield left static" id="iv-mkt"></div></div></div>
    <p class="muted small" style="margin:0">What you put in ticks off this pay's investing. Both parts move your rank.</p>
    <button class="btn primary big" id="iv-go" type="button">Record</button></div>`);
  const mk = () => Math.round((diff - f.put) * 100) / 100, paint = () => { const m = mk(); $('#iv-mkt').textContent = (m > 0.005 ? '+' : '') + money(m); };
  bindField('#iv-put', f, 'put', { label: 'You put in', prefix: '$', dec: 2, max: 1e9, after: paint }); paint();
  $('#iv-go').onclick = () => {
    const m = mk(), t = Date.now();
    if (f.put > 0.005) S.moves.push({ id: uid(), t, date: today(), amount: f.put, type: 'invested', note: 'Investing', src: 'manual' });
    if (Math.abs(m) > 0.005) S.moves.push({ id: uid(), t: t + 1, date: today(), amount: m, type: 'mkt', note: m > 0 ? 'Market up' : 'Market down', src: 'manual' });
    save(); closeSheet(); renderAll(); if (back) back(); toast(f.put > 0.005 ? `Invested +${money(f.put)}` : 'Investments updated');
  };
}

/* ---------- render: stack ---------- */
/* A pay's layers for the bars, with every repayment as one red so the bar stays readable. */
function stackLayers(s) {
  const d = Object.values(s.plan.debts).reduce((a, v) => a + v, 0);
  return [[s.cover || 0, 'var(--bad)'], [s.plan.bills, 'var(--c-bills)'], [potTotal(s), 'var(--c-buy)'], [cardBudget(s), BM.spend.color], [d, 'var(--c-debt)'], [s.plan.save, BM.save.color], [s.plan.invest, BM.invest.color], [s.spare || 0, 'var(--line)']].filter(x => x[0] > 0.5);
}
function barHTML(s) {
  const ls = stackLayers(s), total = Math.max(s.amount + (s.carry || 0) + heldSum(s.held), ls.reduce((a, x) => a + x[0], 0)) || 1;
  return ls.map(([v, c]) => `<span style="width:${(v / total * 100).toFixed(2)}%;background:${c}"></span>`).join('');
}
/* Where a pay goes, as a receipt: what comes out first, then your split, then the total. */
function receiptHTML(s) {
  const mb = s.plan.minsBy, row = (c, n, v, cls = '') => `<div class="rc-row${cls}"><i class="chip" style="background:${c}"></i><span>${n}</span><span class="num">${money(v)}</span></div>`;
  const hv = heldSum(s.held), hk = Object.keys(s.held || {}).filter(k => s.held[k] > 0.005);
  const inc = hv > 0.5 ? `<p class="rc-h">Coming in</p>${row('var(--c-pay)', 'This pay', s.amount + (s.carry || 0))}${row('var(--c-buy)', `Already in ${hk.map(k => esc(nameOf(k))).join(' and ')}`, hv)}` : '';
  let first = ((s.cover || 0) > 0.5 ? row('var(--bad)', 'Last pay, moved past its plan', s.cover) : '') + (s.plan.bills > 0.5 ? row('var(--c-bills)', `Bills${(s.late || []).length ? ` · ${s.late.length} overdue` : ''}`, s.plan.bills) : ''), extra = '';
  Object.entries(s.plan.debts).forEach(([id, v]) => {
    if ((S.debts.find(x => x.id === id) || {}).urgent) { if (v > 0.5) first += row('var(--c-debt)', `${esc(debtName(id))} · urgent`, v); return; }
    const mn = mb ? Math.min(v, mb[id] || 0) : v, ex = v - mn;
    if (mn > 0.5) first += row('var(--c-debt)', esc(debtName(id)), mn);
    if (ex > 0.5) extra += row('var(--c-debt)', `Extra on ${esc(debtName(id))}`, ex);
  });
  const rows = list => list.filter(x => x[2] > 0.5).map(x => row(...x)).join('');

  if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'close': closeSheet(); break;
    case 'qs': closeSheet(); openQS(); break;
    case 'settings': settingsSheet(); break;
    case 'test-end': testEndSheet(); break;
    case 'test-discard': testEnd(false); break;
    case 'test-keep': testEnd(true); break;
    case 'backup': backup(); break;
    case 'restore': restoreSheet(); break;
    case 'restore-file': $('#bk-file').click(); break;
    case 'spent': spentSheet(); break;
    case 'credit': creditSheet(id); break;
    case 'credit-add': creditForm(); break;
    case 'pass': go('home'); window.scrollTo(0, 0); break;
    case 'settle-last': { const R = (S.settles || [])[(S.settles || []).length - 1]; if (R) showSettle(R); break; }
    case 'goal': goalSheet(id); break;
    case 'goal-add': goalSheet(); break;
    case 'buffer': entriesSheet('buffer'); break;
    case 'acct-pay': payAcctSheet(); break;
    case 'invested': entriesSheet('invested'); break;
    case 'pay-debt': { const d = order(S.debts).find(x => !isWallet(x) && debtNow(x) > 0.005); movedSheet({ to: d ? 'd:' + d.id : null, title: 'Record a payment' }); break; }
    case 'moved': movedSheet(); break;
    case 'past-pays': pastPaysSheet(); break;
    case 'pn-done': {
      const stk = latestStack(), x = stk && payNow(stk).done[+a.dataset.i]; if (!x || !x.ids) break;
      openSheet(`${esc(x.name)} this pay`, `<div class="form"><p class="sum-big" style="margin:0">${money(x.amt)}</p><p class="muted small" style="margin:0">This pay. Tap one to change or delete it.</p><div class="grouped">${rowsOf(sortMoves(S.moves.filter(m => x.ids.includes(m.id))), 'Nothing.')}</div></div>`);
      break;
    }
    case 'pn-tick': case 'pn-open': {
      // Done the way it's shown: parked money first, from where it's parked, then the rest from Pay (or the card, for a payment it makes).
      const stk = latestStack(); if (!stk) break;
      const N = payNow(stk), x = N.dues.concat(N.sugs).find(y => y.key === a.dataset.key); if (!x || !x.to) break;
      const w = walletCard(), held = x.held || [], src = x.via ? 'card' : 'pay', fp = x.via ? Math.round((x.amt - held.reduce((t, h) => t + h[1], 0)) * 100) / 100 : x.fromPay ?? x.amt;
      if (a.dataset.act === 'pn-open' || (src === 'card' && w && fp > cardAvail(w) + 0.005)) {
        const h = !(fp > 0.005) && held[0];
        movedSheet(h ? { from: h[0], to: x.to, amount: h[1], title: x.label } : { from: src, to: x.to, amount: fp, title: x.label });
        break;
      }
      const s0 = JSON.stringify(S);
      held.forEach(([k, v]) => S.moves.push(...moveRecs(k, x.to, v, today(), x.label)));
      if (fp > 0.005) S.moves.push(...moveRecs(src, x.to, fp, today(), x.label));
      save(); renderAll(); toast(`${x.label} · ${money(x.amt)}`, undoOf(s0));
      break;
    }
    case 'pva': {
      const stk = S.stacks.find(s => s.id === a.dataset.stack); if (!stk) break;
      if (a.dataset.key === 'card') { paySpendsSheet(stk.id); break; }
      const past = !!a.dataset.past, inSheet = !!a.closest('#sheet'), date = past ? stk.date : today();
      const pm = S.moves.find(m => m.type === 'pay' && m.stack === stk.id);
      const after = inSheet && pm ? () => payDetail(pm.id) : null;
      const it = stackItems(stk).todos.find(x => x.key === a.dataset.key);
      if (it) movedSheet({ from: it.via ? 'card' : 'pay', to: todoTo(it), amount: Math.max(0, Math.round((it.plan - it.done) * 100) / 100), note: it.note, title: it.label, date, after });
      break;
    }
    case 'pva-tick': {
      const stk = S.stacks.find(s => s.id === a.dataset.stack); if (!stk) break;
      const it = stackItems(stk).todos.find(x => x.key === a.dataset.key); if (!it) break;
      const amt = Math.max(0, Math.round((it.plan - it.done) * 100) / 100), from = it.via ? 'card' : 'pay', w = walletCard();
      if (amt < 0.005) break;
      // Not enough on the card: open the sheet, which says so.
      if (from === 'card' && w && amt > cardAvail(w) + 0.005) { a.closest('.pva-r, .stile').querySelector('.pva, .stile-b').click(); break; }
      const s0 = JSON.stringify(S), date = a.dataset.past ? stk.date : today();
      S.moves.push(...moveRecs(from, todoTo(it), amt, date, it.note));
      save(); renderAll();
      const pm = a.closest('#sheet') && S.moves.find(m => m.type === 'pay' && m.stack === stk.id); if (pm) payDetail(pm.id);
      toast(`${it.label} · ${money(amt)}`, undoOf(s0));
      break;
    }
    case 'did-all': {
      const s0 = JSON.stringify(S), n = didAll(a.dataset.stack, !!a.dataset.past);
      const pm = a.closest('#sheet') && S.moves.find(m => m.type === 'pay' && m.stack === a.dataset.stack);
      if (pm) payDetail(pm.id);
      toast(n ? `${n} marked done` : 'Nothing left to do', n ? undoOf(s0) : null);
      break;
    }
    case 'move': moveDetail(id); break;
    case 'pay': payDetail(id); break;
    case 'bill': billSheet(id); break;
    case 'debt': debtSheet(id); break;
    case 'debt-view': debtDetail(id); break;
    case 'add-bill': billSheet(); break;
    case 'add-debt': debtSheet(); break;
    case 'add-buy': buySheet(); break;
    case 'buy': buySheet(id); break;
    case 'balance': balance(); break;
    case 'use-plan': usePlan(a.dataset.k); break;
    case 'upd-pool': updateBal('pool'); break;
    case 'pool-hist': entriesSheet('pool'); break;
    case 'make-mine': {
      const stk = S.stacks.find(s => s.id === a.dataset.stack);
      if (!stk || !stk.one) break;
      const k = stk.pk === 'bal' ? 'debt' : PLANS.includes(stk.pk) && stk.pk !== 'custom' ? stk.pk : 'custom', s0 = JSON.stringify(S);
      if (k === 'custom' && stk.pct) { S.pct = Object.assign({}, stk.pct); fillSplit(); }
      S.plan = k; stk.one = false; delete stk.pct; save(); renderAll(); toast(`${planName(k)} is your plan now`, undoOf(s0));
      break;
    }
    case 'bill-tick': {
      const b = S.bills.find(x => x.id === id); if (!b) break;
      if (b.auto) { toast('Direct debit. It ticks itself off on the due date.'); break; }
      const s0 = JSON.stringify(S), on = tickBill(id, a.dataset.d); save(); renderAll(); toast(on ? `${b.name} ticked off` : `${b.name} unticked`, undoOf(s0));
      break;
    }
    case 'stack-new': ui.stackNew = true; fillPay(); renderAll(); window.scrollTo(0, 0); break;
    case 'stack-cancel': ui.stackNew = false; pvReset(); renderAll(); window.scrollTo(0, 0); break;
    case 'sample': closeSheet(); if (!TEST) testOn(); loadSample(); pvReset(); ui.stackNew = false; fillPlanInputs(); go('home'); toast('Sample data. Test mode, nothing saves.'); break;
    case 'clear-ask': openSheet('Clear everything?', `<div class="form"><p style="margin:0">Deletes every pay, bill, debt and entry${CLOUD.db ? ', on this phone and in your Claude account' : ' on this phone'}. This can't be undone.</p><button class="btn big danger-fill" type="button" data-act="clear-yes">Delete everything</button><button class="btn wide" type="button" data-act="close" style="margin-top:0">Cancel</button></div>`); break;
    case 'clear-yes': S = blank(); ui.stackNew = false; save(); closeSheet(); fillPlanInputs(); fillPay(); go('home'); toast('Everything cleared'); openQS(); break;
  }
});
S = load();
normalize();
document.body.dataset.tab = ui.tab;
buildSplit();
fillPlanInputs(); fillPay();
renderAll();
setCloud('local');
// First open: check your account before walking through setup, so a new device loads your data instead.
Promise.race([cloudInit(), new Promise(r => setTimeout(r, 3500))]).then(() => {
  if (!S.qs && !hasData(S) && $('#qs').hidden) openQS();
});
</script>
